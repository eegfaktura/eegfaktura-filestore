# Checks on every pull request. The repository has no tests yet (known-errors #9), so the two test
# jobs check what can be checked without them:
#   unit — every module byte-compiles and the application imports;
#   full — the Alembic migrations run against a real PostgreSQL and the application starts and
#          serves its OpenAPI document.
# "Requirements pinned" reports on its own that requirements.txt pins only the direct
# dependencies (the transitive ones float); it stays red until the file is complete. Until then
# the test jobs install as the Dockerfile does.
# Versions fixed, each release older than 7 days (checked 2026-10-09): Python 3.13.16
# (2026-09-30), postgres 15.19-alpine (2026-09-21, the major of the production database).
# Actions pinned by commit SHA.

name: PR Checks

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: '3.13.16'

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # psycopg2 builds from source and needs pg_config (the Dockerfile installs libpq-dev and gcc).
      - name: Build dependencies of psycopg2
        run: command -v pg_config || { sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends libpq-dev; }

      - name: Install the requirements
        run: python -m pip install -r requirements.txt

      - name: Byte-compile and import
        run: |
          python -m compileall -q app main.py alembic
          python -c "import main; print('application:', type(main.application).__name__)"

  full:
    name: Full test suite
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:15.19-alpine@sha256:f7d23353e1b15400d22ebe31189f4d314b87a4c129cc400c8c2d8d4ca127bf81
        env:
          POSTGRES_DB: filestore
          POSTGRES_USER: filestore
          POSTGRES_PASSWORD: ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U filestore -d filestore"
          --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      DB_HOSTNAME: 127.0.0.1
      DB_PORT: '5432'
      DB_USERNAME: filestore
      DB_PASSWORD: ci-only
      DB_DATABASE: filestore
      HTTP_PORT: '5000'
      FILESTORE_LOCAL_BASE_DIR: ${{ github.workspace }}/../filestore-data
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # psycopg2 builds from source and needs pg_config (the Dockerfile installs libpq-dev and gcc).
      - name: Build dependencies of psycopg2
        run: command -v pg_config || { sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends libpq-dev; }

      - name: Install the requirements
        run: python -m pip install -r requirements.txt

      # The production database has the schema before the service starts (the migrations put
      # their tables and the version table into it but do not create it).
      - name: Migrations (alembic upgrade head)
        run: |
          PGPASSWORD="$DB_PASSWORD" psql -h "$DB_HOSTNAME" -p "$DB_PORT" -U "$DB_USERNAME" -d "$DB_DATABASE" \
            -c 'CREATE SCHEMA IF NOT EXISTS filestore'
          alembic upgrade head
          alembic current

      - name: Application starts
        run: |
          set -euo pipefail
          mkdir -p "$FILESTORE_LOCAL_BASE_DIR/tmp"
          python main.py > "$RUNNER_TEMP/filestore.log" 2>&1 &
          pid=$!
          for i in $(seq 1 30); do
            if curl -fs "http://localhost:${HTTP_PORT}/openapi.json" > /dev/null; then
              echo "up after ${i}s"; kill "$pid"; exit 0
            fi
            sleep 1
          done
          echo "::error::the application did not answer within 30 s"
          cat "$RUNNER_TEMP/filestore.log"; kill "$pid" || true; exit 1

  requirements:
    name: Requirements pinned
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Build dependencies of psycopg2
        run: command -v pg_config || { sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends libpq-dev; }

      # Only what requirements.txt names, nothing resolved on top: pip check then lists every
      # dependency the file does not pin.
      - name: Install exactly requirements.txt
        run: |
          python -m pip install --no-deps -r requirements.txt
          python -m pip check
