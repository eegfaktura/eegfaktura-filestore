# Checks on every pull request:
#   unit — every module byte-compiles and the application imports;
#   full — the Alembic migrations run against a real PostgreSQL, `alembic check` finds no difference
#          between the models and the migrated schema, the tests (tests/, pytest) pass against that
#          database, and the application starts and serves its OpenAPI document.
# "Lint" runs ruff with the rules in ruff.toml (real bugs only, no style rules).
# "Requirements pinned" checks that requirements.txt pins every dependency, the transitive ones
# included. The test jobs install as the Dockerfile does.
# Versions fixed, each release older than 7 days (checked 2026-10-09): Python 3.13.16
# (2026-09-30), postgres 15.19-alpine (2026-09-21, the major of the production database); ruff
# 0.17.0 (2026-10-09, checked 2026-10-21; test dependencies in requirements-test.txt likewise).
# Actions pinned by commit SHA.
# Every job keeps its output as an artifact for 30 days (test-results-<job>),
# for the CI report collector (vfeeg-development/eegfaktura-dev).

name: PR Checks

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: '3.13.16'
  RUFF_VERSION: '0.17.0'

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # psycopg2 builds from source and needs pg_config (the Dockerfile installs libpq-dev and gcc).
      - name: Build dependencies of psycopg2
        run: command -v pg_config || { sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends libpq-dev; }

      - name: Install the requirements
        run: python -m pip install -r requirements.txt

      - name: Byte-compile and import
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/results"
          {
            python -m compileall -q app main.py alembic
            python -c "import main; print('application:', type(main.application).__name__)"
          } 2>&1 | tee "$RUNNER_TEMP/results/unit.log"

      - name: Keep the test log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results-unit
          path: ${{ runner.temp }}/results
          if-no-files-found: ignore
          retention-days: 30

  full:
    name: Full test suite
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:15.19-alpine@sha256:f7d23353e1b15400d22ebe31189f4d314b87a4c129cc400c8c2d8d4ca127bf81
        env:
          POSTGRES_DB: filestore
          POSTGRES_USER: filestore
          POSTGRES_PASSWORD: ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U filestore -d filestore"
          --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      DB_HOSTNAME: 127.0.0.1
      DB_PORT: '5432'
      DB_USERNAME: filestore
      DB_PASSWORD: ci-only
      DB_DATABASE: filestore
      HTTP_PORT: '5000'
      FILESTORE_LOCAL_BASE_DIR: ${{ github.workspace }}/../filestore-data
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # psycopg2 builds from source and needs pg_config (the Dockerfile installs libpq-dev and gcc).
      - name: Build dependencies of psycopg2
        run: command -v pg_config || { sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends libpq-dev; }

      - name: Install the requirements
        run: python -m pip install -r requirements.txt -r requirements-test.txt

      # The production database has the schema before the service starts (the migrations put
      # their tables and the version table into it but do not create it).
      # alembic check: the models match the schema the migrations build (no pending autogenerate change).
      - name: Migrations (alembic upgrade head, alembic check)
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/results"
          {
            PGPASSWORD="$DB_PASSWORD" psql -h "$DB_HOSTNAME" -p "$DB_PORT" -U "$DB_USERNAME" -d "$DB_DATABASE" \
              -c 'CREATE SCHEMA IF NOT EXISTS filestore'
            alembic upgrade head
            alembic current
            alembic check
          } 2>&1 | tee "$RUNNER_TEMP/results/migrations.log"

      # tests/ against the migrated database: token required, tenant isolation, file categories,
      # upload/download for the own tenant. The tests generate their own RSA keypair.
      - name: Tests (pytest)
        run: python -m pytest -p no:cacheprovider --junitxml "$RUNNER_TEMP/results/pytest.xml" tests

      - name: Application starts
        run: |
          set -euo pipefail
          mkdir -p "$FILESTORE_LOCAL_BASE_DIR/tmp"
          python main.py > "$RUNNER_TEMP/results/filestore.log" 2>&1 &
          pid=$!
          for i in $(seq 1 30); do
            if curl -fs "http://localhost:${HTTP_PORT}/openapi.json" > /dev/null; then
              echo "up after ${i}s"; kill "$pid"; exit 0
            fi
            sleep 1
          done
          echo "::error::the application did not answer within 30 s"
          cat "$RUNNER_TEMP/results/filestore.log"; kill "$pid" || true; exit 1

      - name: Keep the test logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results-full
          path: ${{ runner.temp }}/results
          if-no-files-found: ignore
          retention-days: 30

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install ruff
        run: python -m pip install "ruff==${RUFF_VERSION}"

      - name: ruff check
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/results"
          ruff check --no-cache --output-format github . 2>&1 | tee "$RUNNER_TEMP/results/ruff.log"

      - name: Keep the lint output
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results-lint
          path: ${{ runner.temp }}/results
          if-no-files-found: ignore
          retention-days: 30

  requirements:
    name: Requirements pinned
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Build dependencies of psycopg2
        run: command -v pg_config || { sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends libpq-dev; }

      # Only what requirements.txt names, nothing resolved on top: pip check then lists every
      # dependency the file does not pin.
      - name: Install exactly requirements.txt
        run: python -m pip install --no-deps -r requirements.txt

      - name: pip check
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/results"
          python -m pip check 2>&1 | tee "$RUNNER_TEMP/results/pip-check.log"

      - name: Keep the check output
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results-requirements
          path: ${{ runner.temp }}/results
          if-no-files-found: ignore
          retention-days: 30
